# The Android app. Built with Briefcase from the toolchain in X:\DevTools —
# see build.py, which also copies nextup.py and its assets in beside it.
[tool.briefcase]
project_name = "Next Up"
bundle = "app.nextup"
version = "0.1.78"
url = "https://nextup.app/"
license = "Proprietary"
author = "jambo"
author_email = "jcarstairs@live.co.uk"

[tool.briefcase.app.mobile]
formal_name = "Next Up"
description = "Your films and TV, on the phone."
long_description = """Next Up, with a library of what's on the phone."""
# The Next Up remote, at every size Android asks for — made from
# nextup_logo.png by make_icons.ps1.
icon = "icons/nextup"
# The app's own code, then Next Up itself and what it serves, all side by
# side: nextup.py finds its fonts and logo beside its own file.
sources = [
    "src/mobile",
    "src/nextup.py",
    "src/nextup_fonts",
    "src/nextup_logo.png",
]
requires = []

[tool.briefcase.app.mobile.android]
requires = [
    "toga-android~=0.5.0",
]
# No title bar: the page has its own header. The dark theme, and Next Up's
# own colours instead of Briefcase's teal: the launch screen and the bars
# are near-black like the page, the accent marigold.
base_theme = "Theme.MaterialComponents.NoActionBar"
primary_color = "#060509"
primary_color_dark = "#060509"
accent_color = "#e0a33e"
splash_background_color = "#060509"
build_gradle_dependencies = [
    "com.google.android.material:material:1.13.0",
    "androidx.webkit:webkit:1.15.0",
]
# Reading the films stored on the phone. Asked for at first launch (app.py);
# Android shows the user its own Allow / Don't allow prompt.
permission."android.permission.READ_MEDIA_VIDEO" = {}
# Back goes through Next Up first (app.py, handle_back): Android 13+ only
# hands it to an app that says it wants it.
android_manifest_application_attrs_extra_content = 'android:enableOnBackInvokedCallback="true"'
build_gradle_extra_content = """
chaquopy.defaultConfig.staticProxy("toga_android.widgets.internal.webview")
"""
